<app-navbar></app-navbar>
<div class="container">
    <div>
        <h2>Ajouter un Assiduite :</h2>
    </div>
    <form (ngSubmit)="addAssiduite()">
        
        <div class="col-md-6">
            <div hidden class="mb-3">
                <label class="form-label">ID</label>
                <input type="text" [(ngModel)]="newAssiduite.idAssiduite" name="idAssiduite" class="form-control">
            </div>
            
            <div class="mb-3">
                <label class="form-label">nbHeures travaillés</label>
                <input type="number" [(ngModel)]="newAssiduite.nbHeures" name="nbHeures" class="form-control">
            </div>
           
            <div class="mb-3">
                <label class="form-label">nbHeures supplementaires</label>
                <input type="number" [(ngModel)]="newAssiduite.heuresSupp" name="heuresSupp" class="form-control">
            </div>
        </div>
     
        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label">Personnel correspondant</label>
                <select class="form-control" id="idAssiduite" name="idAssiduite" [(ngModel)]="selectedPersonnel">
                    <option *ngFor="let personnel of personnels" [ngValue]="personnel">
                        {{ personnel.nom }} {{ personnel.prenom + ' - ' + personnel.numCin }}
                    </option>
                </select>
            </div>
           
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" [(ngModel)]="newAssiduite.username" name="username" class="form-control">
            </div>
        </div>
        
        <div class="mt-2">
            <button type="submit" (click)="addAssiduite()" class="btn btn-success">Ajouter</button>
        </div>
    </form>
</div>
