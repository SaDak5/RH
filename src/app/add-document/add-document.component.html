<app-navbar></app-navbar>
<div class="container">
    <div>
        <h2>Ajouter un Document :</h2>
    </div>
    <form (ngSubmit)="addDocument()">
        <!-- Existing fields -->
        <div class="mb-3">
            <label class="form-label">Fichier PDF :</label>
            <input type="file" (change)="onFileSelected($event)" class="form-control">
        </div>
        <div class="col-md-6">
            <div hidden class="mb-3">
                <label class="form-label">ID</label>
                <input type="text" [(ngModel)]="newDocument.idDocument" name="idDocument" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Type de document :</label>
                <select [(ngModel)]="newDocument.type" name="type" class="form-control" required>
                    <option value="" disabled selected>Choisissez le type de document</option>
                    <option value="Certificat">Certificat</option>
                    <option value="Lettre de motivation">Lettre de motivation</option>
                    <option value="Fiche de paie">Fiche de paie</option>
                    <option value="Autres">Autres</option>
                </select>
            </div>
            <div class="mb-3" *ngIf="newDocument.type === 'Autres'">
                <label class="form-label">Autres :</label>
                <input type="text" [(ngModel)]="newDocument.autreType" name="autreType" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Date de création :</label>
                <input type="date" [(ngModel)]="newDocument.dateCreation" name="dateCreation" class="form-control" required>
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label">Personnel correspondant :</label>
                <select class="form-control" [(ngModel)]="selectedPersonnel" name="id" required>
                    <option *ngFor="let personnel of personnels" [ngValue]="personnel">
                        {{ personnel.nom }} {{ personnel.prenom + ' - ' + personnel.numCin }}
                    </option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Username :</label>
                <input type="text" [(ngModel)]="newDocument.username" name="username" class="form-control" required>
            </div>
        </div>
        <div class="mt-2">
            <button type="submit" class="btn btn-success">Ajouter</button>
        </div>
    </form>
</div>
