<app-navbar></app-navbar>
<div class="container">
    <div class="mb-3">
        <h2>Liste des documents</h2>
        <a *ngIf="authService.isAdmin()" type="button" class="btn btn-primary" routerLink="/addDocument">Ajouter un document</a>
    </div>
    <div class="card shadow mb-4">
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Type</th>
                        <th>Date de création</th>
                        <th>Personnel correspondant</th>
                       
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let document of documents">
                        <td>{{document.idDocument}}</td>
                        <td>{{document.type}}</td>
                        <td>{{document.dateCreation | date:'dd/MM/yyyy'}}</td>
                        <td>
                            <a [routerLink]="['/profil', document.personnel?.id]">
                                {{ document.personnel?.nom }} {{ document.personnel?.prenom + ' - ' + document.personnel?.numCin }}
                            </a>
                        </td>
                        <!-- <td>
                            <a *ngIf="document.pdfFile" [href]="document.pdfFile" target="_blank">Voir PDF</a>
                        </td> -->
                        <td>
                            <a *ngIf="authService.isAdmin() || authService.isResponsable()" class="btn btn-warning" [routerLink]="['/updateDocument', document.idDocument]">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                        </td>
                        <td>
                            <a *ngIf="authService.isAdmin()" class="btn btn-danger" (click)="supprimerDocument(document)">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div style="position: fixed; bottom: 20px; left: 20px;">
        <a routerLink="/sidebar" class="btn btn-primary">
            <span class="glyphicon glyphicon-chevron-left"></span>
        </a>
    </div>
</div>
